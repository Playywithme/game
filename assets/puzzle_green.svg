<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF4E9"/><stop offset="1" stop-color="#D5E5CE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyA7C79E" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7C79E"/><stop offset="1" stop-color="#6E9B77"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="230" fill="url(#glow)"/>

  <!-- BIG two-line heading -->
  <text x="300" y="86" text-anchor="middle" font-family="Georgia, serif"
        font-size="42" letter-spacing="2" font-style="italic" fill="#5C8666">A little one</text>
  <text x="300" y="132" text-anchor="middle" font-family="Georgia, serif"
        font-size="42" letter-spacing="2" font-style="italic" fill="#5C8666">is on the way</text>

  
  <g transform="translate(300,355) scale(1.55) translate(-100,-108)">
    <ellipse cx="100" cy="188" rx="70" ry="13" fill="#000000" opacity="0.06"/>

    <!-- hanger -->
    <path d="M100,16 q-10,-1 -10,9 q0,8 10,8" fill="none" stroke="#6E9B77"
          stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M100,33 L55,76 M100,33 L145,76" stroke="#6E9B77"
          stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

    <!-- body -->
    <path id="obody" d="M70,72 L130,72 Q144,73 146,96 L154,152 Q156,172 136,172 L119,172
             Q112,161 100,161 Q88,161 81,172 L64,172 Q44,172 46,152 L54,96 Q56,73 70,72 Z"
          fill="url(#bodyA7C79E)"/>
    <!-- soft top highlight -->
    <ellipse cx="100" cy="96" rx="40" ry="18" fill="#C9E0C1" opacity="0.5"/>

    <!-- sleeves -->
    <path d="M72,76 L44,88 Q33,93 36,103 Q39,113 49,109 L74,99 Z" fill="#A7C79E"/>
    <path d="M128,76 L156,88 Q167,93 164,103 Q161,113 151,109 L126,99 Z" fill="#A7C79E"/>
    <!-- ribbed cuffs -->
    <path d="M40,90 l6,-2 M41,95 l6,-2 M43,100 l6,-2" stroke="#5C8666" stroke-width="1.4" opacity="0.5"/>
    <path d="M160,90 l-6,-2 M159,95 l-6,-2 M157,100 l-6,-2" stroke="#5C8666" stroke-width="1.4" opacity="0.5"/>

    <!-- neckline -->
    <path d="M82,72 Q100,86 118,72 Q100,77 82,72 Z" fill="#ffffff" opacity="0.92"/>
    <ellipse cx="100" cy="71" rx="18" ry="6.5" fill="#ffffff" opacity="0.85"/>

    <!-- little bow at collar -->
    <g transform="translate(100,80)">
      <path d="M0,0 L-11,-6 L-11,6 Z" fill="#6E9B77" opacity="0.85"/>
      <path d="M0,0 L11,-6 L11,6 Z" fill="#6E9B77" opacity="0.85"/>
      <circle cx="0" cy="0" r="3.2" fill="#6E9B77"/>
    </g>

    <!-- center placket + snaps -->
    <line x1="100" y1="92" x2="100" y2="150" stroke="#5C8666" stroke-width="1.4"
          stroke-dasharray="2 4" opacity="0.45"/>
    <circle cx="100" cy="128" r="2.8" fill="#5C8666" opacity="0.75"/>
    <circle cx="100" cy="142" r="2.8" fill="#5C8666" opacity="0.75"/>

    <!-- heart -->
    <path transform="translate(100,110) scale(1.5)"
          d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z"
          fill="#ffffff" opacity="0.95"/>
  </g>

  <circle cx="70" cy="120" r="7" fill="#A7C79E" opacity="0.85"/>
<path transform="translate(128,200) scale(0.5)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#6E9B77" opacity="0.9"/>
<circle cx="58" cy="250" r="6" fill="none" stroke="#A7C79E" stroke-width="3" opacity="0.7"/>
<circle cx="150" cy="330" r="6" fill="#6E9B77" opacity="0.85"/>
<path transform="translate(78,430) scale(0.5)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#A7C79E" opacity="0.9"/>
<circle cx="110" cy="500" r="7" fill="none" stroke="#6E9B77" stroke-width="3" opacity="0.7"/>
<circle cx="70" cy="560" r="6" fill="#A7C79E" opacity="0.85"/>
<path transform="translate(205,560) scale(0.5)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#6E9B77" opacity="0.9"/>
<circle cx="530" cy="120" r="7" fill="#6E9B77" opacity="0.85"/>
<path transform="translate(472,200) scale(0.6)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#A7C79E" opacity="0.9"/>
<circle cx="542" cy="250" r="5" fill="none" stroke="#6E9B77" stroke-width="3" opacity="0.7"/>
<circle cx="450" cy="330" r="6" fill="#A7C79E" opacity="0.85"/>
<path transform="translate(522,430) scale(0.7)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#6E9B77" opacity="0.9"/>
<circle cx="490" cy="500" r="5" fill="none" stroke="#A7C79E" stroke-width="3" opacity="0.7"/>
<circle cx="540" cy="560" r="6" fill="#6E9B77" opacity="0.85"/>
<path transform="translate(398,562) scale(0.5)" d="M0,3 C0,0 -4,-3 -6,-1 C-8,1 -6,4 0,8 C6,4 8,1 6,-1 C4,-3 0,0 0,3 Z" fill="#A7C79E" opacity="0.9"/>
</svg>